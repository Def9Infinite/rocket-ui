<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ORBITAL · Title Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="titlebar">
  <svg class="patch" id="patch-svg" viewBox="0 0 100 100">
    <defs><radialGradient id="pg" cx="50%" cy="40%"><stop offset="0%" stop-color="#0e1b33"/><stop offset="100%" stop-color="#060912"/></radialGradient></defs>
    <circle cx="50" cy="50" r="46" fill="url(#pg)" stroke="var(--cyan)" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(52,227,230,.25)" stroke-width="6"/>
    <path d="M50 18 C58 30 58 52 50 78 C42 52 42 30 50 18Z" fill="#eaf1fb"/>
    <path d="M50 78 C46 70 46 64 50 58 C54 64 54 70 50 78Z" fill="#ff8a3d"/>
    <circle cx="50" cy="38" r="3.5" fill="var(--cyan)"/>
    <path d="M22 70 Q50 60 78 70" fill="none" stroke="var(--cyan)" stroke-width="1.6" opacity=".6"/>
    <g fill="#eaf1fb"><circle cx="28" cy="34" r="1.2"/><circle cx="72" cy="30" r="1.2"/><circle cx="66" cy="52" r="1"/><circle cx="34" cy="54" r="1"/></g>
  </svg>
  <img class="patch patch-img" id="patch-img" alt="" style="display:none" />
  <div class="tb-titles">
    <div class="tb-mission"><span data-i18n="mission">MISSION</span> <b id="t-mission">—</b></div>
    <div class="tb-vehicle" id="t-vehicle">—</div>
  </div>
  <div class="live-pill"><span class="live-dot"></span><span data-i18n="live">LIVE</span></div>
  <div class="tb-spacer"></div>
  <div class="status-pill standby" id="status-pill"><span class="sdot"></span><span id="status-text">STANDBY</span></div>
</header>
<script src="common.js"></script>
<script>
let state=readState();
function paint(){ $('t-mission').textContent=state.mission; $('t-vehicle').textContent=state.vehicle; applyI18n(document, state.lang); applyTheme(state);
  const url=(state.patch||'').trim(), img=$('patch-img'), svg=$('patch-svg');
  if(url){ if(img.getAttribute('src')!==url) img.src=url; img.style.display=''; svg.style.display='none'; }
  else { img.style.display='none'; svg.style.display=''; } }
function tickStatus(){ const si=resolveStatus(state); $('status-pill').className='status-pill '+si.cls; $('status-text').textContent=tr(si.key, state.lang); requestAnimationFrame(tickStatus); }
subscribe(s=>{ state=s; paint(); });
paint(); tickStatus();
</script>
</body>
</html>
