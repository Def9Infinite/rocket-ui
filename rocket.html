<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ORBITAL · Vehicle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="rocket-info">
  <div class="ri-head">
    <svg class="ri-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c3 2 4 6 4 9 0 4-2 7-4 9-2-2-4-5-4-9 0-3 1-7 4-9z"/><path d="M8 14l-3 3 1 4 3-2M16 14l3 3-1 4-3-2"/></svg>
    <div><div class="ri-name" id="ri-name">—</div><div class="ri-op" id="ri-op">—</div></div>
  </div>
  <div class="ri-body" id="ri-body"></div>
</div>
<script src="common.js"></script>
<script>
const row=(k,v,hl)=>`<div class="ri-row"><span class="k">${esc(k)}</span><span class="v ${hl?'hl':''}">${esc(v)||'—'}</span></div>`;
const section=(title,rows)=>`<div class="ri-section"><div class="ri-sh">${title}</div>${rows}</div>`;
function render(state){
  const r=state.rocket, L=state.lang, T=k=>tr(k,L);
  $('ri-name').textContent=r.name; $('ri-op').textContent=r.operator;
  let html=section(T('sec_vehicle'), row(T('r_height'),r.height)+row(T('r_diameter'),r.diameter)+row(T('r_mass'),r.mass,true)+row(T('r_payload'),r.payload,true));
  if(r.hasP) html+=section(T('sec_payload'), row(T('p_name'),r.pName,true)+row(T('p_customer'),r.pCustomer)+row(T('p_type'),r.pType)+row(T('p_mass'),r.pMass)+row(T('p_orbit'),r.pOrbit,true));
  if(r.hasB) html+=section(T('sec_boosters'), row(T('r_motors'),r.bEng,true)+row(T('r_thrust'),r.bThrust)+row(T('r_burn'),r.bBurn));
  html+=section(T('sec_s1'), row(T('r_engines'),r.s1eng,true)+row(T('r_thrust'),r.s1thrust)+row(T('r_burn'),r.s1burn)+row(T('r_prop'),r.s1prop));
  html+=section(T('sec_s2'), row(T('r_engine'),r.s2eng,true)+row(T('r_thrust'),r.s2thrust)+row(T('r_burn'),r.s2burn)+row(T('r_fairing'),r.fairing));
  if(r.hasS3) html+=section(T('sec_s3'), row(T('r_engine'),r.s3eng,true)+row(T('r_thrust'),r.s3thrust)+row(T('r_burn'),r.s3burn));
  if(r.hasUS) html+=section(T('sec_us'), row(T('r_engine'),r.usEng,true)+row(T('r_thrust'),r.usThrust)+row(T('r_burn'),r.usBurn));
  $('ri-body').innerHTML=html;
}
subscribe(render);
</script>
</body>
</html>
