<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ORBITAL · Ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="ticker" id="tk-root">
  <div class="ticker-label">⬡ <span data-i18n="tk_flightdata">FLIGHT DATA</span></div>
  <div class="ticker-track" id="ticker-track"></div>
</div>
<script src="common.js"></script>
<script>
let lastSig=null;
function render(state){
  { const r=$('tk-root'); r.classList.remove('bg-solid','bg-half','bg-clear'); r.classList.add('bg-'+bgLevel(state)); }
  applyI18n(document, state.lang);
  const items=tickerItems(state);
  const sig=JSON.stringify(items);
  if(sig===lastSig) return;        // avoid restarting the scroll animation needlessly
  lastSig=sig;
  const one=items.map(([k,v])=>`<span class="tk-item"><span class="tk-k">${esc(k)}</span><span class="tk-v">${esc(v)}</span></span>`).join('');
  $('ticker-track').innerHTML=one+one;
}
subscribe(render);
// the PHASE/NEXT items change with the clock even when state hasn't been written,
// so refresh the ticker content on a slow timer too
setInterval(()=>render(readState()), 2000);
</script>
</body>
</html>
