<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ORBITAL · Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="timeline" id="tl-root">
  <div class="tl-now" id="tl-now">T-00:00:00</div>
  <div class="tl-viewport" id="tl-viewport"><div class="tl-axis"></div><div class="tl-track" id="tl-track"></div></div>
  <div class="tl-playhead"></div>
</div>
<script src="common.js"></script>
<script>
let state=readState();
let PPS=1.4, builtSig=null;
const xFor = t => t*PPS;
function buildTrack(){
  const track=$('tl-track'); track.innerHTML='';
  const evs=[...state.events].sort((a,b)=>a.t-b.t); if(!evs.length) return;
  const minT=evs[0].t-90, maxT=evs[evs.length-1].t+90;
  const step=(maxT-minT)>900?120:60; const gStart=Math.ceil(minT/step)*step;
  for(let g=gStart; g<=maxT; g+=step){
    const tick=document.createElement('div'); tick.className='tl-tick'; tick.style.left=xFor(g)+'px'; track.appendChild(tick);
  }
  evs.forEach((ev,i)=>{
    const el=document.createElement('div'); el.className='tl-ev'+(ev.m?' major':'')+(i%2?' down':' up');
    el.style.left=xFor(ev.t)+'px'; el.dataset.t=ev.t;
    el.innerHTML=`<div class="dot"></div><div class="lbl">${esc(evLabel(ev.l,state.lang))}</div><div class="tm">${fmt(ev.t).full}</div>`;
    track.appendChild(el);
  });
}
function frame(){
  const vp=$('tl-viewport'); const w=vp.clientWidth||800; PPS=Math.max(0.9, w/520);
  const sig=PPS.toFixed(2)+'|'+state.lang+'|'+JSON.stringify(state.events);
  if(sig!==builtSig){ builtSig=sig; buildTrack(); }
  const track=$('tl-track');
  let t=currentT(state.clock); if(t==null){ const e=[...state.events].sort((a,b)=>a.t-b.t); t=e.length?e[0].t:0; }
  const center=w/2; const tx=center-xFor(t); track.style.transform=`translateX(${tx}px)`;
  const evs=[...state.events].sort((a,b)=>a.t-b.t); const tNow=currentT(state.clock);
  let nextIdx=evs.findIndex(e=> tNow!=null && e.t>tNow);
  [...track.querySelectorAll('.tl-ev')].forEach(el=>{
    const et=+el.dataset.t; el.classList.remove('passed','next'); let isNext=false;
    if(tNow!=null){ if(et<=tNow) el.classList.add('passed'); else if(nextIdx>=0 && et===evs[nextIdx].t){ el.classList.add('next'); isNext=true; } }
    const screenX=tx+xFor(et), dist=Math.abs(screenX-center), major=el.classList.contains('major');
    let op; if(isNext) op=1; else if(dist<150) op=1; else if(dist<300) op=Math.max(major?0.5:0,1-(dist-150)/150); else op=0;
    el.querySelector('.lbl').style.opacity=op; el.querySelector('.tm').style.opacity=op;
  });
  $('tl-now').textContent=(tNow==null?'STANDBY':fmt(tNow).full);
  requestAnimationFrame(frame);
}
subscribe(s=>{ state=s; $('tl-root').classList.toggle('clear', !!s.tlClear); });
frame();
</script>
</body>
</html>
