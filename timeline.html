<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ORBITAL · Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="timeline" id="tl-root">
  <div class="tl-now" id="tl-now">T-00:00:00</div>
  <div class="tl-viewport" id="tl-viewport"><div class="tl-axis"></div><div class="tl-track" id="tl-track"></div></div>
  <div class="tl-playhead"></div>
</div>
<script src="common.js"></script>
<script>
let state=readState();
let PPS=1.4, builtSig=null;
const xFor = t => t*PPS;
function buildTrack(){
  const track=$('tl-track'); track.innerHTML='';
  const evs=[...state.events].sort((a,b)=>a.t-b.t); if(!evs.length) return;
  const minT=evs[0].t-90, maxT=evs[evs.length-1].t+90;
  const step=(maxT-minT)>900?120:60; const gStart=Math.ceil(minT/step)*step;
  for(let g=gStart; g<=maxT; g+=step){
    const tick=document.createElement('div'); tick.className='tl-tick'; tick.style.left=xFor(g)+'px'; track.appendChild(tick);
  }
  const els=evs.map(ev=>{
    const el=document.createElement('div'); el.className='tl-ev'+(ev.m?' major':'');
    el.style.left=xFor(ev.t)+'px'; el.dataset.t=ev.t;
    el.innerHTML=`<div class="dot"></div><div class="leader"></div><div class="lbl">${esc(evLabel(ev.l,state.lang))}</div><div class="tm">${fmt(ev.t).full}</div>`;
    track.appendChild(el);
    return {el, x:xFor(ev.t)};
  });
  // measure each label's text width (one reflow), then place into 2 lanes. A label that would
  // collide is shifted horizontally (left:Δ) and a leader line angles back to its dot. The shift
  // is ORDER-PRESERVING: each label's centre is kept >= the previous one's, so reading the labels
  // left-to-right always matches event order (no label jumps past a later one).
  els.forEach(o=>{ o.w=Math.max(o.el.querySelector('.lbl').offsetWidth, o.el.querySelector('.tm').offsetWidth); });
  const GAP=8, DOTBOT=33, laneTopY=[37,68], laneRight=[null,null];
  let prevCenter=-Infinity;
  els.forEach(o=>{
    const half=o.w/2;
    let lane=0, center=Infinity, left=0, disp=Infinity;
    for(let L=0;L<2;L++){
      let cl=(laneRight[L]==null)? (o.x-half) : Math.max(o.x-half, laneRight[L]+GAP);   // no same-lane overlap
      let c=cl+half;
      if(c<prevCenter){ c=prevCenter; cl=c-half; }                                       // keep left-to-right order
      const d=c-o.x;
      if(d<disp){ disp=d; lane=L; center=c; left=cl; }
    }
    laneRight[lane]=left+o.w; prevCenter=center;
    const shift=Math.round(center-o.x);
    o.el.classList.add(lane===0?'la':'lb');
    o.el.querySelector('.lbl').style.left=shift+'px';
    o.el.querySelector('.tm').style.left=shift+'px';
    const dy=laneTopY[lane]-DOTBOT, len=Math.hypot(shift,dy), ang=Math.atan2(dy,shift)*180/Math.PI;
    o.el.querySelector('.leader').style.cssText=`left:0;top:${DOTBOT}px;width:${len}px;transform:rotate(${ang}deg)`;
  });
}
function frame(){
  const vp=$('tl-viewport'); const w=vp.clientWidth||800; PPS=Math.max(0.9, w/520);
  const sig=PPS.toFixed(2)+'|'+state.lang+'|'+JSON.stringify(state.events);
  if(sig!==builtSig){ builtSig=sig; buildTrack(); }
  const track=$('tl-track');
  let t=currentT(state.clock); if(t==null){ const e=[...state.events].sort((a,b)=>a.t-b.t); t=e.length?e[0].t:0; }
  const center=w/2; const tx=center-xFor(t); track.style.transform=`translateX(${tx}px)`;
  const evs=[...state.events].sort((a,b)=>a.t-b.t); const tNow=currentT(state.clock);
  let nextIdx=evs.findIndex(e=> tNow!=null && e.t>tNow);
  // dots always show the full sequence; only label the few events nearest the playhead (+ the next
  // one), fading the rest, to save space. The CSS opacity transition smooths labels in/out.
  const info=[...track.querySelectorAll('.tl-ev')].map(el=>{
    const et=+el.dataset.t; el.classList.remove('passed','next'); let isNext=false;
    if(tNow!=null){ if(et<=tNow) el.classList.add('passed'); else if(nextIdx>=0 && et===evs[nextIdx].t){ el.classList.add('next'); isNext=true; } }
    return {el, isNext, dist:Math.abs((tx+xFor(et))-center)};
  });
  const N=3, show=new Set([...info].sort((a,b)=>a.dist-b.dist).slice(0,N).map(o=>o.el));
  info.forEach(o=>{ if(o.isNext) show.add(o.el); });                 // always keep the next event labelled
  info.forEach(o=>{
    const op=(show.has(o.el) && o.dist<720)?1:0;
    o.el.querySelector('.lbl').style.opacity=op; o.el.querySelector('.tm').style.opacity=op;
    const ld=o.el.querySelector('.leader'); if(ld) ld.style.opacity=op;
  });
  $('tl-now').textContent=(tNow==null?'STANDBY':fmt(tNow).full);
  requestAnimationFrame(frame);
}
subscribe(s=>{ state=s; const r=$('tl-root'); r.classList.remove('bg-solid','bg-half','bg-clear'); r.classList.add('bg-'+bgLevel(s)); });
try{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ builtSig=null; }); }catch(e){}  // re-measure once fonts load
frame();
</script>
</body>
</html>
